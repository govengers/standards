# Weekly update PRs for what the build pins: Go modules and tools, the workflow's actions and the Dockerfile's
# digest-pinned base images. CI gates every PR like any other.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
  - package-ecosystem: bun
    directory: /ui
    schedule:
      interval: weekly
