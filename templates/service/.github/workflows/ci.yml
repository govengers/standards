name: CI

# Template for a govengers service (govengers/standards templates/service). Replace "example" with the service name.
#
# Every push and pull request, in parallel jobs: lint and vulncheck, unit tests of changed and affected packages
# (TST-014), the end-to-end suite unless server and suite are unchanged (TST-015), the frontend's
# `just test-typescript`, and one job per recipe in `recipes`; then the pipeline budget (TST-018). A push to main
# or a v* tag then builds, attests and pushes the image: :main on main, :1.2.3 and the moving :1.2, :1, :latest on
# a tag. Nightly and on v* tags: every test, uncached and shuffled, so a flaky test cannot hide in the cache for
# longer than a day and a release is never tested from the cache. Require the check
# `service / check / lint, test, e2e, vulncheck` in branch protection.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

# A new push to a pull request cancels its older run; pushes to main and tags always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  service:
    uses: govengers/.github/.github/workflows/go-service.yml@v1
    with:
      image: ghcr.io/govengers/example
      dockerfile: docker/server.Dockerfile
      full: ${{ github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/v') }}
      # Bun on every job's PATH (squawk in db-check) and the TypeScript job; a service without UI keeps it and
      # sets typescript: false
      bun-version: "1.4.4"
      recipes: '["generate-check", "db-check", "openapi-check"]' # each in its own job
      budget-warm-seconds: 300 # TST-018: fails a pipeline over 5 minutes (+20 %) with warm caches
      budget-cold-seconds: 480 # and over 8 minutes cold
    permissions:
      contents: write # badges branch
      packages: write # push to ghcr.io
      id-token: write # keyless signing of the build provenance
      attestations: write # store the attestation
      actions: read # the budget job reads the run's job times
