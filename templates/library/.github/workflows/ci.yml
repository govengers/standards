name: CI

# Template for a govengers library (govengers/standards templates/library).
#
# Every push and pull request: lint, unit tests of changed and affected packages (TST-014), the end-to-end suite
# unless it is unchanged (TST-015), vulncheck, and README badges from main; the check job fails over budget-seconds
# (TST-018). Nightly, on v* tags and on demand (workflow_dispatch): every test, uncached, so a flaky test cannot hide
# in the cache for longer than a day and a release is never tested from the cache; a red full run opens an issue
# assigned to the logins in the variable CI_ALERT_ASSIGNEES (TST-021).
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

# One group per ref and event: a new push to a pull request cancels its older run; pushes to main, tags and full
# runs always finish, and a full run never waits for a push or the other way round (TST-021).
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  library:
    uses: govengers/.github/.github/workflows/go-library.yml@v1
    with:
      full: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
      budget-seconds: 300 # TST-018: fails a run whose checks took over 5 minutes
    permissions:
      contents: write # the badges job pushes test and coverage badges to the badges branch

  # A red scheduled or dispatched run opens an issue, every further red run comments, the next green one closes it
  alert:
    needs: library
    if: ${{ always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    uses: govengers/.github/.github/workflows/nightly-alert.yml@v1
    with:
      result: ${{ needs.library.result }}
      assignees: ${{ vars.CI_ALERT_ASSIGNEES }}
    permissions:
      issues: write # the issue of a red full run
      actions: read # its failed jobs
